name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          LAST="$(git tag -l "v$BASE.*" | sort -V | tail -1)"
          if [[ -n "$LAST" ]]; then
            PATCH=$(( ${LAST##*.} + 1 ))
          else
            PATCH=1
          fi
          echo "version=$BASE.$PATCH" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "Version $BASE.$PATCH (previous: ${LAST:-none})"

      - name: Build app
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          chmod +x scripts/build.sh
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/build.sh 2>&1 | tee build.log

      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p /tmp/ci-logs
          cp build.log /tmp/ci-logs/build.log 2>/dev/null || echo "No log produced" > /tmp/ci-logs/build.log
          echo "run ${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA} version ${VERSION} result ${OUTCOME}" > /tmp/ci-logs/STATUS
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Build ${GITHUB_RUN_NUMBER}: ${OUTCOME}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          RANGE="${LAST:+$LAST..}HEAD"
          {
            echo "## What's new"
            git log --no-merges --format='- %s' $RANGE
            echo
            echo "## Install"
            echo "Download **Disk-Alert-$VERSION.dmg**, open it and drag Disk Alert into Applications. Already installed? Use **Check for Updates** in the menu bar."
          } > notes.md
          gh release create "v$VERSION" build/*.dmg --target "$GITHUB_SHA" \
            --title "Disk Alert $VERSION" --notes-file notes.md --latest
